<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forge-my-Project</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/app.css"><script src="/js/legacy.js" defer></script></head>
<body><main><h1>Forge-my-Project</h1><p>Configure ton projet puis genere une archive avec des bases d'architecture, de securite et de CI/CD a verifier avant utilisation.</p>
<form id="config"><label for="name">Nom du projet</label><input id="name" name="name" required pattern="[a-z][a-z0-9-]{1,48}[a-z0-9]" placeholder="mon-projet">
<label for="description">Description et objectifs</label><textarea id="description" name="description" maxlength="500" rows="3"></textarea>
<label for="language">Langage</label><select id="language" name="language"><option value="python">Python</option><option value="typescript">JavaScript / TypeScript (base JS)</option></select>
<label for="agent">Agent</label><select id="agent" name="agent"><option value="codex">Codex</option><option value="claude">Claude</option><option value="copilot">Copilot</option><option value="agnostic">Agnostique</option></select>
<label for="deployment">Deploiement</label><select id="deployment" name="deployment"><option value="none">Aucun</option><option value="docker">Docker</option><option value="s3ns">S3NS</option><option value="outscale">OUTSCALE</option></select>
<label for="security">Niveau de securite</label><select id="security" name="security"><option value="strict">Strict</option><option value="hardened">Renforce</option></select>
<label><input id="one_pr" type="checkbox" name="one_pr" checked> Une seule PR ouverte a la fois</label>
<button type="submit">Generer le ZIP</button></form><p id="status" role="status"></p>
<small>Les integrations MCP, scans externes, lockfiles et deploiements doivent encore etre configures et verifies.</small></main></body></html>
