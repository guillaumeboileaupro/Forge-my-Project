name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Syntax
        run: python3 -m compileall -q generator.py server.py start.py forge tests
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Browser E2E (Firefox headless)
        env:
          FORGE_E2E: '1'
        run: python3 -m unittest tests.test_e2e_firefox tests.test_e2e_journey_firefox -v

  generated-projects:
    name: CI generee des profils predefinis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Setup Go (profil go-cli)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false
      - name: Setup Java (profil java-library)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Generate and run each generated pipeline (online verification)
        run: python3 tests/smoke_generated.py --verify
      - name: Prove generated security controls detect injected issues
        run: python3 tests/smoke_security.py

  security:
    name: Securite du depot (secrets, SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for secret scanning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      # Versions et empreinte alignees sur catalogs/security/tools.json (verifie par tests/test_repo_ci.py).
      - name: Secrets (Gitleaks)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 --no-banner .
      - name: Generated Git hooks with gitleaks installed
        run: PATH="$RUNNER_TEMP:$PATH" python -m unittest tests.test_engine_hooks -v
      - name: SAST (Bandit)
        run: |
          python -m pip install "bandit==1.9.4"
          bandit -r forge server.py generator.py -q --severity-level medium --confidence-level medium
      # Version alignee sur catalogs/security/tools.json (verifie par tests/test_repo_ci.py) ; regles locales, sans telemetrie.
      - name: SAST multi-langage (Semgrep 1.184.0, regles locales)
        run: |
          python -m venv "$RUNNER_TEMP/forge-semgrep"
          "$RUNNER_TEMP/forge-semgrep/bin/python" -m pip install --disable-pip-version-check -q "semgrep==1.184.0"
          "$RUNNER_TEMP/forge-semgrep/bin/semgrep" scan --config .semgrep/forge.yml --metrics=off --disable-version-check --json --output "$RUNNER_TEMP/semgrep.json" .
          python scripts/semgrep_gate.py "$RUNNER_TEMP/semgrep.json" ERROR
      - name: Detection Semgrep prouvee (regles et passerelle sur du code reellement vulnerable)
        env:
          FORGE_SEMGREP: ${{ runner.temp }}/forge-semgrep/bin/semgrep
        run: python -m unittest tests.test_semgrep_rules -v

  attribution:
    name: Attribution Git (aucun agent IA auteur, committer ou co-auteur)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Auteurs, committers, trailers et description de PR
        run: python3 scripts/attribution_guard.py ci
      - name: Detection prouvee (tests du garde)
        run: python3 -m unittest tests.test_attribution_guard -v
