<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forge-my-Project</title>
<style>body{font:16px system-ui,sans-serif;max-width:770px;margin:35px auto;padding:0 20px;background:#f6f7fb;color:#1c2435}main{padding:28px;border-radius:14px;background:white;box-shadow:0 4px 18px #0001}label{display:block;margin:15px 0 6px;font-weight:600}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bfc9d8;border-radius:7px;font:inherit}button{background:#1a4bb0;color:white;font-weight:700;margin-top:24px;cursor:pointer}small{color:#57657a}#status{white-space:pre-wrap}</style></head>
<body><main><h1>Forge-my-Project</h1><p>Configure ton projet puis genere une archive avec des bases d'architecture, de securite et de CI/CD a verifier avant utilisation.</p>
<form id="config"><label for="name">Nom du projet</label><input id="name" name="name" required pattern="[a-z][a-z0-9-]{1,48}[a-z0-9]" placeholder="mon-projet">
<label for="description">Description et objectifs</label><textarea id="description" name="description" maxlength="500" rows="3"></textarea>
<label for="language">Langage</label><select id="language" name="language"><option value="python">Python</option><option value="typescript">JavaScript / TypeScript (base JS)</option></select>
<label for="agent">Agent</label><select id="agent" name="agent"><option value="codex">Codex</option><option value="claude">Claude</option><option value="copilot">Copilot</option><option value="agnostic">Agnostique</option></select>
<label for="deployment">Deploiement</label><select id="deployment" name="deployment"><option value="none">Aucun</option><option value="docker">Docker</option><option value="s3ns">S3NS</option><option value="outscale">OUTSCALE</option></select>
<label for="security">Niveau de securite</label><select id="security" name="security"><option value="strict">Strict</option><option value="hardened">Renforce</option></select>
<label><input id="one_pr" type="checkbox" name="one_pr" checked style="width:auto"> Une seule PR ouverte a la fois</label>
<button type="submit">Generer le ZIP</button></form><p id="status" role="status"></p>
<small>Les integrations MCP, scans externes, lockfiles et deploiements doivent encore etre configures et verifies.</small></main>
<script>
document.querySelector('#config').addEventListener('submit', async e => {
 e.preventDefault();
 const form=e.currentTarget, data=Object.fromEntries(new FormData(form).entries());
 data.one_pr=!!form.elements.one_pr.checked;
 const status=document.querySelector('#status'); status.textContent='Generation...';
 try {
  const res=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  if(!res.ok) throw new Error(await res.text());
  const blob=await res.blob(), url=URL.createObjectURL(blob), link=document.createElement('a');
  link.href=url; link.download=data.name+'.zip'; link.click(); URL.revokeObjectURL(url);
  status.textContent='Archive generee.';
 } catch(err) {status.textContent='Erreur : '+err.message;}
});
</script></body></html>
